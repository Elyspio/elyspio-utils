version: '3.8'
services:
    mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        container_name: elyspio-utils-telemetry-sql
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=yourStrong(!)Password
        ports:
            - "1435:1433"
        volumes:
            - ./sql:/var/opt/mssql/data

    mongo:
        image: mongo:latest
        container_name: elyspio-utils-telemetry-mongo
        ports:
            - "27017:27017"
        volumes:
            - ./mongo:/data/db
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=root

    redis:
        image: redis
        container_name: elyspio-utils-telemetry-redis
        ports:
            - "6379:6379"
